name: Build Maps 31 HUD Probe
on:
  push:
    branches: [feature/yandex-maps-hud-v31, feature/maps31-maneuver-no-background, feature/maps31-hud-live-preview, feature/maps31-bg-lanes-minimap-v2]
    paths:
      - 'yandex-bt/maps-relay/**'
      - 'yandex-bt/settings.gradle'
      - '.github/workflows/maps31-hud-probe.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Compile Yandex Maps module
        working-directory: yandex-bt
        run: gradle --no-daemon :maps-relay:assembleDebug :maps-glasses:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YandexMaps31-HUD-Relay-Compiler
          path: yandex-bt/maps-relay/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YandexMaps31-HUD-Rokid-Receiver
          path: yandex-bt/maps-glasses/build/outputs/apk/debug/*.apk

      - name: Package Android signing tools for local verification
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" signing-tools/libc++.so
      - uses: actions/upload-artifact@v4
        with:
          name: YandexMaps31-HUD-Signing-Tools
          path: signing-tools/
