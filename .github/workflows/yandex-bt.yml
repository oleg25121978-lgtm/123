name: Build isolated Yandex BT HUD
on:
  push:
    branches: [feature/yandex-phone-bluetooth-hud]
    paths:
      - 'yandex-bt/**'
      - '.github/workflows/yandex-bt.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and assemble both APKs
        working-directory: yandex-bt
        run: gradle --no-daemon :phone:testDebugUnitTest :phone:assembleDebug :glasses:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Yandex-HUD-Phone-APK
          path: yandex-bt/phone/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Yandex-HUD-Glasses-APK
          path: yandex-bt/glasses/build/outputs/apk/debug/*.apk
