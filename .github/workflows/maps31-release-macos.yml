name: Maps31 full packaging on macOS Intel
on:
  push:
    branches: [feature/maps31-bg-lanes-minimap-v2]
    paths:
      - '.github/workflows/maps31-release-macos.yml'
      - 'yandex-maps-v31/repack_maps31.py'
      - 'yandex-bt/maps-relay/**'
      - 'yandex-bt/maps-glasses/**'
  workflow_dispatch:
    inputs:
      source_apk_url:
        description: 'Private HTTPS URL for the exact user-supplied yandex_maps_31.1.5_mod(1).apk; if empty, try repository secret'
        type: string
        required: false
        default: ''
      source_sha256:
        description: 'Optional SHA256 of exact source APK'
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 55
    env:
      SOURCE_APK_URL: ${{ inputs.source_apk_url || secrets.MAPS31_SOURCE_APK_URL }}
      EXPECTED_SOURCE_SHA256: ${{ inputs.source_sha256 || secrets.MAPS31_SOURCE_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare Android SDK on macOS Intel
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          echo "build_tools=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"
          uname -a
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile genuine Maps31 module and Rokid receiver on macOS
        working-directory: yandex-bt
        run: gradle --no-daemon :maps-relay:assembleDebug :maps-glasses:assembleDebug
      - name: Prepare artifact directory and copy receiver
        run: |
          mkdir -p dist
          cp yandex-bt/maps-glasses/build/outputs/apk/debug/maps-glasses-debug.apk \
             dist/Maps31_Rokid_Receiver_Latest.apk
          "$build_tools/apksigner" verify --verbose dist/Maps31_Rokid_Receiver_Latest.apk
          shasum -a 256 dist/Maps31_Rokid_Receiver_Latest.apk
      - name: Read ONLY exact user APK from private upload URL when provided
        id: source
        env:
          APK_URL: ${{ env.SOURCE_APK_URL }}
        run: |
          if [ -z "$APK_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "NO USER APK URL AVAILABLE. Not producing or mislabeling a phone APK."
            exit 0
          fi
          curl --fail --location --retry 2 --silent --show-error "$APK_URL" -o source-user-mod.apk
          file source-user-mod.apk
          python3 - <<'PY'
          import os,zipfile,hashlib
          path='source-user-mod.apk'
          assert os.path.getsize(path)>180_000_000, 'Expected full APK; do not use dummy/trimmed file'
          with zipfile.ZipFile(path) as z:
              names=set(z.namelist())
              assert 'classes17.dex' in names,'Expected user mod APK with 17 DEX files'
              assert any(x.startswith('lib/armeabi-v7a/') for x in names),'ARM32 must be preserved'
              assert any(x.startswith('lib/arm64-v8a/') for x in names),'ARM64 must be preserved'
              assert 'AndroidManifest.xml' in names
          h=hashlib.file_digest(open(path,'rb'),'sha256').hexdigest()
          expected=os.environ.get('EXPECTED_SOURCE_SHA256','').lower().strip()
          if expected:
              assert h==expected,f'Unexpected APK! sha256 {h} does not match provided source hash'
          print('Verified user APK size:',os.path.getsize(path),'SHA256:',h)
          PY
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Merge HUD into user APK with NO ABI or resource trimming
        if: steps.source.outputs.available == 'true'
        run: |
          python3 yandex-maps-v31/repack_maps31.py \
            source-user-mod.apk \
            yandex-bt/maps-relay/build/outputs/apk/debug/maps-relay-debug.apk \
            maps31-unsigned.apk
          "$build_tools/zipalign" -f -p 4 maps31-unsigned.apk maps31-aligned.apk
          keytool -genkeypair -keystore maps31-ci.jks \
            -storepass 'maps31-ci-ephemeral' -keypass 'maps31-ci-ephemeral' \
            -alias maps31 -keyalg RSA -keysize 3072 -validity 3650 \
            -dname 'CN=Maps31 HUD test signing,O=Local test' -noprompt
          "$build_tools/apksigner" sign \
            --ks maps31-ci.jks --ks-key-alias maps31 \
            --ks-pass pass:maps31-ci-ephemeral \
            --key-pass pass:maps31-ci-ephemeral \
            --out dist/Yandex_Maps_31.1.5_USER_MOD_Rokid_HUD_BG_LANES_MINIMAP_TEST.apk \
            maps31-aligned.apk
          "$build_tools/apksigner" verify --verbose \
            dist/Yandex_Maps_31.1.5_USER_MOD_Rokid_HUD_BG_LANES_MINIMAP_TEST.apk
          python3 - <<'PY'
          import zipfile
          src='source-user-mod.apk'
          dst='dist/Yandex_Maps_31.1.5_USER_MOD_Rokid_HUD_BG_LANES_MINIMAP_TEST.apk'
          with zipfile.ZipFile(src) as a,zipfile.ZipFile(dst) as b:
              old=set(a.namelist())
              new=set(b.namelist())
              original_payload={x for x in old if x.startswith(('lib/','assets/','res/'))}
              assert original_payload <= new,sorted(original_payload-new)[:10]
              for item in original_payload:
                  assert a.read(item)==b.read(item),f'Changed without authorization: {item}'
              assert 'classes18.dex' in new
              assert 'AndroidManifest.xml' in new
              print('PASS: all native libraries, assets and resources preserved byte-identically')
          PY
          shasum -a 256 dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Maps31-Rokid-Receiver-macOS-Intel
          path: dist/Maps31_Rokid_Receiver_Latest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.available == 'true'
        with:
          name: Maps31-Phone-HUD-BG-LANES-MINIMAP-macOS-Intel
          path: dist/Yandex_Maps_31.1.5_USER_MOD_Rokid_HUD_BG_LANES_MINIMAP_TEST.apk
          if-no-files-found: error
