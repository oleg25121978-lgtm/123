name: Build Rokid Watch APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: Rokid-Watch4Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
